---
x-flint-env: &flint-env
  APP_URL: ${APP_URL:-http://${PUBLIC_HOST:-localhost}:4700}
  GITEA_PUBLIC_URL: ${GITEA_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:4701}
  GITEA_URL: http://gitea:3000
  GITEA_WEBHOOK_SECRET: flint-webhook-secret

services:
  app:
    build: .
    profiles: [app]
    environment:
      <<: *flint-env
      DATABASE_URL: postgres://flint:flint@postgres:5432/flint
      DRAFT_UPLOAD_RETENTION_DAYS: ${DRAFT_UPLOAD_RETENTION_DAYS:-30}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-perplexity/pplx-embed-v1-0.6b}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-30000}
      INSTANCE_ADMINS: ${INSTANCE_ADMINS:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      PORT: "4700"
      S3_ACCESS_KEY_ID: flint
      S3_BUCKET: flint
      S3_ENDPOINT: http://silo:9000
      S3_SECRET_ACCESS_KEY: flint-silo-secret
      SEARCH_EMBEDDING_TIMEOUT_MS: ${SEARCH_EMBEDDING_TIMEOUT_MS:-1500}
      SEARCH_EMBEDDINGS_PER_MINUTE: ${SEARCH_EMBEDDINGS_PER_MINUTE:-300}
      SESSION_LIFETIME_DAYS: ${SESSION_LIFETIME_DAYS:-30}
      STORAGE_SWEEP_CRON: ${STORAGE_SWEEP_CRON:-1 0 * * 0}
      STREAMS_PER_USER: ${STREAMS_PER_USER:-20}
      TRASH_PURGE_CRON: ${TRASH_PURGE_CRON:-0 0 * * *}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      UPLOADS_PER_USER: ${UPLOADS_PER_USER:-4}
    volumes:
      # Bun loads GITEA_CLIENT_ID and GITEA_CLIENT_SECRET from it.
      - ./.env.local:/app/.env.local:ro
    ports:
      - "${PUBLIC_HOST_BIND:-127.0.0.1}:4700:4700"
    depends_on:
      postgres: { condition: service_healthy }
      silo: { condition: service_healthy }
      gitea: { condition: service_healthy }

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: flint
      POSTGRES_PASSWORD: flint
      POSTGRES_DB: flint
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:4702:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flint"]
      interval: 1s
      timeout: 5s
      retries: 10

  silo:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: flint
      MINIO_ROOT_PASSWORD: flint-silo-secret
    volumes:
      - silo:/data
    ports:
      - "127.0.0.1:4703:9000"
      - "127.0.0.1:4704:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15

  gitea:
    image: gitea/gitea:28-rootless
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__log__LEVEL: Warn
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__ROOT_URL: ${GITEA_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:4701}/
      GITEA__security__ALLOWED_HOST_LIST: private
      GITEA__security__EGRESS_MODE: lax
      GITEA__ui__FEED_MAX_COMMIT_NUM: "50"
      GITEA_RUNNER_REGISTRATION_TOKEN: &runner-token flint-runner-registration-token-0000
    volumes:
      - gitea-config:/etc/gitea
      - gitea-data:/var/lib/gitea
    ports:
      - "${PUBLIC_HOST_BIND:-127.0.0.1}:4701:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Gitea refuses webhooks to reserved addresses such as OrbStack's host.docker.internal
  # (0.250.250.254), so it reaches `bun run dev` on the host through this relay.
  host-relay:
    image: alpine/socat:1.8.1.3
    command: ["TCP-LISTEN:4700,fork,reuseaddr", "TCP:host.docker.internal:4700"]
    extra_hosts:
      - host.docker.internal:host-gateway

  runner:
    image: gitea/runner:5
    environment:
      CONFIG_FILE: /runner.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_NAME: flint-runner
      GITEA_RUNNER_REGISTRATION_TOKEN: *runner-token
    configs:
      - runner.yaml
    volumes:
      - runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gitea: { condition: service_healthy }

configs:
  runner.yaml:
    # Jobs join the compose network, because the runner hands them http://gitea:3000. "-" keeps
    # the host's Docker socket out of job containers, so a workflow cannot take over the host.
    content: |
      runner:
        labels: ["ubuntu-latest:docker://node:24-alpine"]
      container:
        network: flint
        docker_host: "-"

networks:
  default:
    name: flint

volumes:
  gitea-config:
  gitea-data:
  postgres:
  runner:
  silo:
