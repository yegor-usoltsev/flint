---
x-flint-env: &flint-env
  APP_URL: http://${PUBLIC_HOST:-localhost}:4700
  GITEA_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:4701
  GITEA_URL: http://gitea:3000
  GITEA_WEBHOOK_SECRET: flint-webhook-secret

services:
  app:
    build: .
    profiles: [app]
    environment:
      <<: *flint-env
      DATABASE_URL: postgres://flint:flint@postgres:5432/flint
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-perplexity/pplx-embed-v1-0.6b}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      PORT: "4700"
      S3_ACCESS_KEY_ID: flint
      S3_BUCKET: flint
      S3_ENDPOINT: http://silo:9000
      S3_SECRET_ACCESS_KEY: flint-silo-secret
      STORAGE_SWEEP_CRON: ${STORAGE_SWEEP_CRON:-1 0 * * 0}
      TRASH_PURGE_CRON: ${TRASH_PURGE_CRON:-0 0 * * *}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
    volumes:
      # Bun loads GITEA_CLIENT_ID and GITEA_CLIENT_SECRET from it.
      - ./.env.local:/app/.env.local:ro
    ports:
      - "${PUBLIC_HOST_BIND:-127.0.0.1}:4700:4700"
    depends_on:
      postgres: { condition: service_healthy }
      silo-init: { condition: service_completed_successfully }
      flint-init-app: { condition: service_completed_successfully }

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: flint
      POSTGRES_PASSWORD: flint
      POSTGRES_DB: flint
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:4702:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flint"]
      interval: 1s
      timeout: 5s
      retries: 10

  silo:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: flint
      MINIO_ROOT_PASSWORD: flint-silo-secret
    volumes:
      - silo:/data
    ports:
      - "127.0.0.1:4703:9000"
      - "127.0.0.1:4704:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15

  silo-init:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command:
      - sh
      - -c
      - mc alias set local http://silo:9000 flint flint-silo-secret && mc mb --ignore-existing local/flint
    depends_on:
      silo: { condition: service_healthy }

  gitea:
    image: gitea/gitea:28-rootless
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__log__LEVEL: Warn
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__ROOT_URL: http://${PUBLIC_HOST:-localhost}:4701/
      GITEA__security__ALLOWED_HOST_LIST: private
      GITEA__security__EGRESS_MODE: lax
      GITEA__ui__FEED_MAX_COMMIT_NUM: "50"
      GITEA_RUNNER_REGISTRATION_TOKEN: &runner-token flint-runner-registration-token-0000
    volumes:
      - gitea-config:/etc/gitea
      - gitea-data:/var/lib/gitea
    ports:
      - "${PUBLIC_HOST_BIND:-127.0.0.1}:4701:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Gitea refuses webhooks to reserved addresses such as OrbStack's host.docker.internal
  # (0.250.250.254), so it reaches `bun run dev` on the host through this relay.
  host-relay:
    image: alpine/socat:1.8.1.3
    command: ["TCP-LISTEN:4700,fork,reuseaddr", "TCP:host.docker.internal:4700"]
    extra_hosts:
      - host.docker.internal:host-gateway

  gitea-init:
    image: gitea/gitea:28-rootless
    volumes:
      - gitea-config:/etc/gitea
      - gitea-data:/var/lib/gitea
    command:
      - sh
      - -c
      - |
        set -e
        for user in alice bob carol; do
          gitea admin user list | awk -v user=$$user '$$2 == user { found = 1 } END { exit !found }' ||
            gitea admin user create --username $$user --password password --email $$user@example.com \
              --must-change-password=false $$([ $$user = alice ] && echo --admin)
        done
        api="curl -fsS -o /dev/null -u alice:password -H Content-Type:application/json http://gitea:3000/api/v1"
        $$api/orgs/acme 2>/dev/null || $$api/orgs -d '{"username":"acme"}'
    depends_on:
      gitea: { condition: service_healthy }

  flint-init:
    image: oven/bun:1.4-alpine
    user: bun
    working_dir: /app
    environment:
      <<: *flint-env
      GITEA_ADMIN_PASSWORD: password
      GITEA_ADMIN_USER: alice
      GITEA_STALE_WEBHOOK_URL: http://app:4700/api/webhooks/gitea
      GITEA_WEBHOOK_URL: http://host-relay:4700/api/webhooks/gitea
    volumes:
      - .:/app
    # Keeps one system webhook: this one for `bun run dev` on the host, flint-init-app's for the
    # app profile.
    command: ["bun", "scripts/gitea-bootstrap.ts"]
    depends_on:
      gitea-init: { condition: service_completed_successfully }

  flint-init-app:
    extends: flint-init
    profiles: [app]
    environment:
      GITEA_STALE_WEBHOOK_URL: http://host-relay:4700/api/webhooks/gitea
      GITEA_WEBHOOK_URL: http://app:4700/api/webhooks/gitea
    depends_on:
      flint-init: { condition: service_completed_successfully }

  runner:
    image: gitea/runner:5
    environment:
      CONFIG_FILE: /runner.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_NAME: flint-runner
      GITEA_RUNNER_REGISTRATION_TOKEN: *runner-token
    configs:
      - runner.yaml
    volumes:
      - runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    # The init dependencies let `docker compose up --wait` accept their exit.
    depends_on:
      gitea: { condition: service_healthy }
      flint-init: { condition: service_completed_successfully }
      silo-init: { condition: service_completed_successfully }

configs:
  runner.yaml:
    # Jobs join the compose network, because the runner hands them http://gitea:3000.
    content: |
      runner:
        labels: ["ubuntu-latest:docker://node:24-alpine"]
      container:
        network: flint

networks:
  default:
    name: flint

volumes:
  gitea-config:
  gitea-data:
  postgres:
  runner:
  silo:
