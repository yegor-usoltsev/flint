---
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # bump.yml starts it this way, because a tag pushed with GITHUB_TOKEN triggers no workflow.
  workflow_dispatch: {}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: yusoltsev
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: yegor-usoltsev
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/yegor-usoltsev/flint
            yusoltsev/flint
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The action completes only Markdown URLs, so the HTML image paths become absolute here.
      - run: >-
          sed -E "s#src=\"(assets/[^\"]+)\"#src=\"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/\1?sanitize=true\"#g" README.md > "$RUNNER_TEMP/dockerhub.md"
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: yusoltsev
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: yusoltsev/flint
          readme-filepath: ${{ runner.temp }}/dockerhub.md
          enable-url-completion: true
      - uses: actions/setup-node@v7
        with:
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: npm publish
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm pkg set name=@yusoltsev/flint-cli && npm publish --access public
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance needs a public repository.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
