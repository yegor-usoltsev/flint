---
name: Release

# Only bump.yml starts a release, so a tag or release made by hand publishes nothing.
on:
  workflow_dispatch: {}

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: yusoltsev
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: yegor-usoltsev
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/yegor-usoltsev/flint
            yusoltsev/flint
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The action completes only Markdown URLs, so the HTML image paths become absolute here.
      - run: >-
          sed -E "s#src=\"(assets/[^\"]+)\"#src=\"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/\1?sanitize=true\"#g" README.md > "$RUNNER_TEMP/dockerhub.md"
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: yusoltsev
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: yusoltsev/flint
          readme-filepath: ${{ runner.temp }}/dockerhub.md
          enable-url-completion: true
      - uses: actions/setup-node@v7
        with:
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      # The checks let a failed release run again.
      - run: test -n "$(npm view "@yegor-usoltsev/flint-cli@${GITHUB_REF_NAME#v}" version)" || npm publish
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: >-
          test -n "$(npm view "@yusoltsev/flint-cli@${GITHUB_REF_NAME#v}" version)" || (npm pkg set name=@yusoltsev/flint-cli && npm publish --access public --provenance)
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit
          version=${GITHUB_REF_NAME#v}
          previous=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" --exclude "*-*" "$GITHUB_REF_NAME^" 2> /dev/null || true)
          {
            echo "## Changelog"
            git log --reverse --no-merges --invert-grep --grep="^Release v[0-9]" --format="* %H %s" "${previous:+$previous..}$GITHUB_REF_NAME"
            echo
            echo "## Docker images"
            echo "- [\`yusoltsev/flint:$version\`](https://hub.docker.com/r/yusoltsev/flint/tags?name=$version)"
            echo "- [\`ghcr.io/$GITHUB_REPOSITORY:$version\`](https://github.com/$GITHUB_REPOSITORY/pkgs/container/flint)"
            echo
            echo "## npm packages"
            echo "- [\`@yusoltsev/flint-cli@$version\`](https://www.npmjs.com/package/@yusoltsev/flint-cli/v/$version)"
            echo "- [\`@yegor-usoltsev/flint-cli@$version\`](https://github.com/$GITHUB_REPOSITORY/pkgs/npm/flint-cli)"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
