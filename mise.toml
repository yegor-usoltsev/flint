[tools]
bun = "latest"
# Runs the npm tools below.
node = "lts"
# Pull request reviews and merges.
gh = "latest"
# UI and accessibility checks in a real browser.
"npm:agent-browser" = { version = "latest", allow_builds = true }
# Backlog and issues for this repository; our own CLI, so its fresh releases and new package name skip the age checks.
"npm:@yusoltsev/flint-cli" = { version = "latest", minimum_release_age = "0s", allow_low_downloads = true }
# Installs the Git hook on every `mise install` and turns off a global `hook.prek`, which would run prek twice.
prek = { version = "latest", postinstall = { run = "prek install && git config hook.prek.enabled false", when = "always" } }
